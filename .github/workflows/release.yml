name: release
# Push a tag like v1.0.0 (it must equal app/version.py) to build photagSetup.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # run it by hand on main: the tag vX.Y.Z (from app/version.py) is created by the release itself
    inputs:
      prerelease:
        description: "Mark as a pre-release (hidden from the in-app update check, flagged on GitHub)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    # the same tests that run on every push, now INSIDE the release and in parallel with the builds: nothing is published unless they pass,
    # so a release can be started right after a push without waiting for the push's own test run (saves about 5 minutes)
    uses: ./.github/workflows/tests.yml
  unix:
    # Linux (tar.gz) and macOS (zip with photag.app) builds, made by the same reusable workflow that tests them on every change to the spec
    uses: ./.github/workflows/unix-build.yml
  build:
    # runs at the same time as the Linux / macOS builds (it used to wait for them: about 3 minutes longer); the publish job below joins them
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Code signing (SignPath) is OFF until it is configured: it needs the repository variables SIGNPATH_ORGANIZATION_ID and
      # SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN (see docs/CODE_SIGNING_POLICY.md). Without them every step below
      # that mentions signing is skipped and the build is exactly what it was before.
      # Microsoft Store package (MSIX): built only when the three repository variables from the app's Partner Center page exist
      # (STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_NAME); it is kept as a workflow artifact to upload to Partner Center by hand.
      STORE: ${{ (vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != '' && vars.STORE_PUBLISHER_NAME != '') && 'true' || 'false' }}
      SIGNING: ${{ (vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_API_TOKEN != '') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tag matches app/version.py
        shell: bash
        run: |
          v=$(python -c "from app.version import __version__ as v; print(v)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - run: python tools/make_version_info.py
      - run: python -m PyInstaller --noconfirm photag.spec
      - run: python -m PyInstaller --noconfirm photag_backup.spec
      - name: "Signing: collect the programs (photag.exe, photag-backup.exe)"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force to_sign | Out-Null
          Copy-Item dist/photag/photag.exe to_sign/
          Copy-Item dist/photag-backup.exe to_sign/
      - name: "Signing: upload the programs"
        if: env.SIGNING == 'true'
        id: upload_exes
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: to_sign
      - name: "Signing: sign the programs (SignPath)"
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.upload_exes.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed_programs
      - name: "Signing: put the signed programs back and check them"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: python tools/signing.py install-programs signed_programs
      - run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% installer.iss'
      - name: "Signing: upload the installer"
        if: env.SIGNING == 'true'
        id: upload_setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: installer_output/photagSetup.exe
      - name: "Signing: sign the installer (SignPath)"
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload_setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed_installer
      - name: "Signing: put the signed installer back and check it"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: python tools/signing.py install-setup signed_installer
      - name: "Put a copy of the installer in a ZIP too (an extra download, NOT instead of the .exe -- the in-app update still uses photagSetup.exe)"
        shell: pwsh
        run: Compress-Archive -Path installer_output/photagSetup.exe -DestinationPath "dist/photagSetup-$env:VERSION.zip" -CompressionLevel Optimal
      - name: "Build the code update (a small zip of the app code - updates run without an installer, so Smart App Control cannot block them)"
        run: python tools/make_code_zip.py
      - name: "Build the portable ZIP (no installer - runs from a USB stick or any folder)"
        run: python tools/make_portable.py
      - name: "Build the install scripts (photag-install.bat / .ps1: download + unpack the portable ZIP without the Mark-of-the-Web)"
        run: python tools/make_install_script.py
      - name: "Build the MSI (Windows Installer package for msiexec / Intune; an extra download -- if it fails, the release goes on without it)"
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          python tools/make_msi.py
      - name: "Store: build the Microsoft Store package (MSIX; Microsoft signs it when it is published)"
        if: env.STORE == 'true'
        env:
          PHOTAG_STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          PHOTAG_STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PHOTAG_STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: python tools/make_msix.py
      - name: "Store: keep the MSIX to upload to Partner Center"
        if: env.STORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: photag-store-msix
          path: dist/photag-*.msix
          retention-days: 30
      - name: Collect the release files
        shell: bash
        run: |
          mkdir release_files
          cp installer_output/photagSetup.exe dist/photagSetup-*.zip dist/photag-code-*.zip dist/photag-*-portable.zip dist/photag-install.bat dist/photag-install.ps1 release_files/
          cp dist/photag-*.msi release_files/ 2>/dev/null || echo "no MSI this time (its step failed): the release goes on without it"
          ls -la release_files
      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release_files/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # joins the Windows build and the Linux / macOS builds and creates the GitHub release (its body is the "what is new" text inside the app)
    needs: [tests, unix, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the Windows files and the Linux and macOS builds
        uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Put them together
        shell: bash
        run: |
          mkdir release_files
          cp parts/release-windows/* release_files/
          cp $(find parts -name 'photag-*-linux-x64.tar.gz' -o -name 'photag-*-macos-*.zip') release_files/
          ls -la release_files
      - name: Publish the release (the release body is the "what is new" text inside the app)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "from app.version import __version__ as v; print(v)")
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then [ "$TAG" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $TAG"; exit 1; }; fi
          notes=docs/release-notes-v${VERSION}.md
          [ -f "$notes" ] || notes=docs/release-notes-v1.0.0.md
          flags=()
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          cd release_files
          shopt -s nullglob
          msi=(photag-*.msi)
          gh release create "${TAG}" --target "${GITHUB_SHA}" photagSetup.exe photagSetup-*.zip photag-code-*.zip photag-*-portable.zip photag-install.bat photag-install.ps1 photag-*-linux-x64.tar.gz photag-*-macos-*.zip "${msi[@]}" --title "photag ${VERSION}" --notes-file "../$notes" "${flags[@]}"
