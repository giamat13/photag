name: tests
on:
  push:
    paths-ignore:            # a change of text only (docs, READMEs, the web page) has nothing to test; a release still runs everything (below)
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_call:             # the release workflow runs these same tests next to its builds and publishes only if they pass

jobs:
  # Windows, in parallel: the server / import / backup tests in two halves and the browser (Edge) tests on a runner of their own
  # -- one job did all of it in a row (about 5 minutes); now the slowest part decides (about 2.5).
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Translations are complete
        if: matrix.part == 1
        run: python tools/i18n.py check
      - name: Server, import, backup, update and library tests (half ${{ matrix.part }} of 2)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          i=0
          for t in test_import_stats test_takeout_parts test_update_rollback test_server_security test_port_instance test_library_default test_backup_media_sets test_trash_menu test_compress_backup test_auto_update test_auto_import test_backup_verify test_features_ui test_update_blocked test_code_update test_runtime_lock test_ref_folder test_backup_reduced test_smart_features test_onedrive test_exif_search test_face_suggest test_cf_fallback test_storage_breakdown test_triplan test_burst_stack test_export_zip test_export_xmp test_export_html test_lrcat_candidates test_import_xmp_recovery test_digikam_import test_social_import test_backup_no_pil test_beta_channel test_exif_full test_nondestructive_edit test_edit_ops_v2 test_release_workflow test_version_scheme test_install_script test_export_meta test_platform_dirs test_opener test_keystore test_backup_unix test_trash_unix test_msix test_portable test_fileassoc test_viewer test_backup_external test_release_notes test_background test_backup_locked_dir test_power test_geotag test_slidevideo test_send_small test_viewer_handoff test_msi; do
            i=$((i+1))
            [ $(( i % 2 )) -eq $(( ${{ matrix.part }} % 2 )) ] || continue
            echo "=== $t"; python tools/$t.py || exit 1
          done
  ui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: UI smoke test (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/ui_smoke.py
      - name: UI test of the analysis, smart collections and timeline (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_smart_ui.py
      - name: UI test of the Develop module, Auto and the EXIF panel (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_develop_ui.py
      - name: UI test of the pre-release banner and manual check (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_prerelease_ui.py
      - name: UI test of the background switches and the picture-viewer offer (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_background_ui.py
      - name: UI test of adding places to photos without GPS (Edge)
        if: ${{ !cancelled() }}
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/test_geotag_ui.py

  # The same code on Linux and macOS (issue #3): the tests that do not need Windows. test_update_rollback needs powershell.exe and the
  # *_ui tests need Edge; both stay on the Windows job above.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0
      - run: python -m pip install -r requirements.txt pyyaml==6.0.1 playwright==1.63.0
      - name: Translations are complete
        run: python tools/i18n.py check
      - name: Tests that do not need Windows
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for t in test_import_stats test_takeout_parts test_server_security test_port_instance test_library_default test_backup_media_sets test_compress_backup test_auto_import test_backup_verify test_update_blocked test_code_update test_runtime_lock test_ref_folder test_backup_reduced test_smart_features test_onedrive test_exif_search test_face_suggest test_cf_fallback test_storage_breakdown test_triplan test_burst_stack test_export_zip test_export_xmp test_export_html test_lrcat_candidates test_import_xmp_recovery test_digikam_import test_social_import test_backup_no_pil test_beta_channel test_exif_full test_nondestructive_edit test_edit_ops_v2 test_version_scheme test_export_meta test_platform_dirs test_opener test_keystore test_backup_unix test_trash_unix test_unix_run test_msix test_portable test_fileassoc test_viewer test_backup_external test_release_notes test_background test_backup_locked_dir test_power test_geotag test_slidevideo test_send_small test_viewer_handoff test_msi; do
            echo "=== $t"; python tools/$t.py || exit 1
          done
      - name: Chromium for the UI tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m playwright install --with-deps chromium
          echo "PHOTAG_TEST_BROWSER=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: UI tests on Linux (Chromium instead of Edge)
        if: runner.os == 'Linux'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for t in ui_smoke test_smart_ui test_develop_ui test_prerelease_ui test_trash_menu test_auto_update test_features_ui test_viewer_ui test_background_ui test_geotag_ui; do
            echo "=== $t"; python tools/$t.py || exit 1
          done
