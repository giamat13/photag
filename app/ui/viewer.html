<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photag</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="i18n.js"></script>
</head>
<body>
<div id="stage"><img id="pic" alt="" draggable="false"><video id="vid" controls playsinline></video><div id="crop" class="hidden"></div></div>
<div id="strip" class="hidden"></div>
<div id="msg" class="hidden"></div>
<div id="menu" class="hidden" role="menu"></div>
<div id="dlg" class="hidden"><div class="box"><b id="dlg-title"></b><input id="dlg-input" autocomplete="off"><div class="row"><button id="dlg-cancel">Cancel</button><button id="dlg-ok" class="primary">OK</button></div></div></div>
<div id="printbox" aria-hidden="true"><img id="printimg" alt=""></div>
<aside id="panel" class="hidden">
  <div class="ph"><b id="ptitle"></b><button id="pclose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="p-info" class="pb"></div>
  <div id="p-map" class="pb"><div id="vmap"></div><div id="coords"></div></div>
  <div id="p-edit" class="pb"></div>
</aside>
<div id="bar">
  <div id="name"></div>
  <div id="meta"></div>
  <div class="sp"></div>
  <button id="b-prev" title="Previous picture"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="b-next" title="Next picture"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="b-out" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M16 16l4 4"/></svg></button>
  <button id="b-in" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M16 16l4 4"/></svg></button>
  <button id="b-fit" title="Fit to window"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="b-rot" title="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg></button>
  <button id="b-full" title="Full screen"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
  <button id="b-edit" title="Edit"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button id="b-info" title="Show information (EXIF)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.5"/></svg></button>
  <button id="b-map" title="Show on the map"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.5 6-10a6 6 0 1 0-12 0c0 4.5 6 10 6 10z"/><circle cx="12" cy="11" r="2"/></svg></button>
  <button id="b-del" title="Move to the Recycle Bin"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></button>
  <button id="b-strip" title="Thumbnail strip (T)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="9" rx="1"/><path d="M4 18h3M10.5 18h3M17 18h3"/></svg></button>
  <button id="b-show" title="Slideshow"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
  <button id="b-more" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  <button id="b-dir" title="Show in folder"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
  <button id="b-add" title="Add to the photag library"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="viewer.js"></script>
</body>
</html>
