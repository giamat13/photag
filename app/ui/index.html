<!-- menu bar (Windows-style) -->
<div id="menubar" class="menubar" role="menubar"></div>

<!-- top panel: identity plate + activity + module picker -->
<header id="toppanel" class="toppanel dimmable">
  <div class="identity">
    <img class="lrmark" src="icon.png" alt="">
    <div class="idtext">
      <b>photag</b>
      <div id="activity" class="activity hidden"><span id="act-label"></span><div class="act-bar"><i id="act-fill"></i></div></div>
    </div>
  </div>
  <nav class="modules" id="modules">
    <button data-mod="library" class="on">Library</button><span>|</span>
    <button data-mod="develop">Edit</button><span>|</span>
    <button data-mod="slideshow">Slideshow</button>
  </nav>
  <button class="edge-t" data-toggle="top" title="Hide/Show Top Panel (F5)"></button>
</header>

<div id="ws" class="ws">
  <!-- LEFT PANEL -->
  <aside id="left" class="side left dimmable">
    <div class="side-scroll">
      <section class="pnl" data-p="nav">
        <h3><span>Navigator</span><em class="nav-modes"><a data-zoom="fit" class="on">Fit</a><a data-zoom="1">1:1</a></em></h3>
        <div class="pbody"><div id="navigator" class="navigator"><img id="nav-img" alt=""><div id="nav-rect" class="nav-rect hidden"></div></div></div>
      </section>
      <div class="lib-only">
        <section class="pnl" data-p="catalog"><h3><span>Catalog</span></h3><div class="pbody"><div class="rows" id="p-catalog"></div></div></section>
        <section class="pnl" data-p="folders"><h3><span>Folders</span></h3><div class="pbody"><div class="rows" id="p-folders"></div></div></section>
        <section class="pnl" data-p="colls"><h3><span>Collections</span><button class="hbtn" id="new-smart" title="New Smart Collection"><svg class="ic"><use href="#i-smart"/></svg></button><button class="hbtn" id="new-coll" title="New Collection (Ctrl+N)"><svg class="ic"><use href="#i-plus"/></svg></button></h3>
          <div class="pbody"><div class="rows" id="p-colls"></div></div></section>
      </div>
      <div class="dev-only">
        <section class="pnl" data-p="presets"><h3><span>Presets</span></h3><div class="pbody"><div class="rows" id="p-presets"></div></div></section>
        <section class="pnl" data-p="history"><h3><span>History</span></h3><div class="pbody"><div class="rows" id="p-history"></div></div></section>
      </div>
    </div>
    <div class="side-foot lib-only">
      <button id="btn-import">Import...</button>
      <button id="btn-export">Export...</button>
    </div>
    <div class="side-foot dev-only">
      <button id="btn-copy-prev" title="Apply the settings of the previously edited photo">Previous</button>
      <button id="btn-dev-auto" title="Improve this photo automatically: exposure, contrast, highlights, shadows, white balance, vibrance and sharpness">Auto</button>
      <button id="btn-dev-reset">Reset</button>
    </div>
  </aside>
  <button class="edge edge-l" data-toggle="left" title="Hide/Show Panel (F7)"></button>

  <!-- CENTER -->
  <main id="center" class="center">
    <div id="filterbar" class="filterbar lib-only">
      <div class="fb-row">
        <span class="fb-title">Library Filter:</span>
        <nav class="fb-tabs" id="fb-tabs">
          <a data-fb="text">Text</a><a data-fb="attr">Attribute</a><a data-fb="meta">Metadata</a><a data-fb="none" class="on">None</a>
        </nav>
        <span class="spacer"></span>
        <span class="fb-state" id="fb-state"></span>
      </div>
      <div class="fb-panel hidden" id="fb-text">
        <label>Text</label>
        <select id="ft-field"><option value="any">Any Searchable Field</option><option value="name">File Name</option><option value="meaning">Meaning (local AI, press Enter)</option></select>
        <label class="ft-box"><svg class="ic"><use href="#i-search"/></svg><input id="ft-q" type="search" placeholder="Search"></label>
      </div>
      <div class="fb-panel hidden" id="fb-attr"></div>
      <div class="fb-panel meta hidden" id="fb-meta"></div>
    </div>

    <div id="stage" class="stage">
      <div id="v-grid" class="v-grid" tabindex="-1"><div id="grid-inner" class="grid-inner"></div></div>
      <div id="v-loupe" class="v-loupe hidden"><div id="loupe-media" class="loupe-media"></div><div id="loupe-info" class="loupe-info"></div></div>
      <div id="v-compare" class="v-compare hidden"></div>
      <div id="v-survey" class="v-survey hidden"></div>
      <div id="v-people" class="v-people hidden"></div>
      <div id="v-timeline" class="v-timeline hidden"><div id="tl-main" class="tl-main"></div><div id="tl-rail" class="tl-rail"></div></div>
      <div id="v-review" class="v-review hidden"></div>
      <div id="v-map" class="v-map hidden" dir="ltr"><div id="map-canvas"></div><div id="map-note" class="map-note"></div></div>
      <div id="v-develop" class="v-develop hidden"><div id="dev-canvas" class="dev-canvas"><img id="dev-img" alt=""></div><div id="crop-ov" class="crop-ov hidden"></div><div id="dev-badge" class="dev-badge hidden">Before</div></div>
      <div id="v-empty" class="v-empty hidden"></div>
    </div>

    <div id="toolbar" class="toolbar"></div>
  </main>

  <button class="edge edge-r" data-toggle="right" title="Hide/Show Panel (F8)"></button>
  <!-- RIGHT PANEL -->
  <aside id="right" class="side right dimmable">
    <div class="side-scroll">
      <section class="pnl" data-p="histo">
        <h3><span>Histogram</span></h3>
        <div class="pbody histo"><canvas id="histo" width="300" height="120"></canvas><div class="histo-meta" id="histo-meta"></div></div>
      </section>
      <div class="lib-only">
        <section class="pnl" data-p="kwing"><h3><span>Keywording</span></h3><div class="pbody" id="p-kwing"></div></section>
        <section class="pnl" data-p="kwlist"><h3><span>Keyword List</span></h3><div class="pbody" id="p-kwlist"></div></section>
        <section class="pnl" data-p="meta"><h3><span>Metadata</span></h3><div class="pbody" id="p-meta"></div></section>
      </div>
      <div class="dev-only">
        <div class="toolstrip" id="dev-tools">
          <button data-tool="crop" title="Crop Tool (R)"><svg class="ic"><use href="#i-crop"/></svg></button>
        </div>
        <section class="pnl" data-p="basic"><h3><span>Basic</span></h3><div class="pbody" id="p-basic"></div></section>
        <section class="pnl" data-p="transform"><h3><span>Transform</span></h3><div class="pbody" id="p-transform"></div></section>
      </div>
    </div>
    <div class="side-foot lib-only">
      <button id="btn-sync-meta" title="Copy the caption and rating of the active photo to all selected photos">Synchronize Metadata</button>
    </div>
    <div class="side-foot dev-only">
      <button id="btn-dev-revert" title="Revert to Original File">Revert</button>
      <button id="btn-dev-apply" class="primary">Apply</button>
    </div>
  </aside>
</div>

<!-- filmstrip -->
<footer id="filmstrip" class="filmstrip dimmable">
  <button class="edge-b" data-toggle="film" title="Hide/Show Filmstrip (F6)"></button>
  <div class="fs-head">
    <button class="fs-ic" id="fs-grid" title="Grid (G)"><svg class="ic"><use href="#i-grid"/></svg></button>
    <button class="fs-ic" id="fs-back" title="Previous Source"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="fs-ic" id="fs-fwd" title="Next Source"><svg class="ic"><use href="#i-next"/></svg></button>
    <div class="fs-path" id="fs-path"></div>
    <span class="spacer"></span>
    <div class="fs-filter" id="fs-filter"></div>
  </div>
  <div class="fs-strip" id="fs-strip"><div class="fs-inner" id="fs-inner"></div></div>
</footer>

<!-- lights-out veil, slideshow, dialogs -->
<div id="slideshow" class="slideshow hidden">
  <img id="ss-a" alt=""><img id="ss-b" alt="">
  <div class="ss-bar" id="ss-bar">
    <button onclick="ssStep(-1)" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button id="ss-pp" onclick="ssToggle()" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
    <button onclick="ssStep(1)" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
    <span id="ss-count"></span>
    <button onclick="ssCast()" title="Cast to screen (Win+K)" aria-label="Cast to screen (Win+K)"><svg class="ic"><use href="#i-cast"/></svg></button>
    <button onclick="ssStop()" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="import" class="importer hidden"></div>
<div id="menu-pop" class="menu-pop hidden"></div>
<div id="menu-sub" class="menu-pop menu-sub hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
