<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photag</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --accent: #7c5cfc;
    --accent2: #c084fc;
    --accent3: #06b6d4;
    --text: #e8e8f0;
    --text-muted: #6b6b85;
    --border: #2a2a3a;
    --success: #10b981;
    --error: #f43f5e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(124,92,252,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(192,132,252,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 30px rgba(124,92,252,0.4);
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 16px;
    margin-top: 8px;
    font-weight: 300;
  }

  /* Upload area */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124,92,252,0.05), rgba(192,132,252,0.05));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 40px rgba(124,92,252,0.2);
  }

  .upload-zone:hover::before, .upload-zone.drag-over::before {
    opacity: 1;
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
  }

  .upload-text {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .upload-subtext {
    color: var(--text-muted);
    font-size: 14px;
  }

  #fileInput { display: none; }

  /* Image preview */
  .preview-area {
    display: none;
    margin-top: 24px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .preview-area.visible { display: block; }

  .preview-area img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }

  .change-image-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(10,10,15,0.8);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Heebo', sans-serif;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .change-image-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /* API Key */
  .apikey-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px 28px;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .apikey-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .apikey-input-wrap {
    flex: 1;
    min-width: 180px;
    position: relative;
  }

  .apikey-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 9px 40px 9px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: ltr;
  }

  .apikey-input::placeholder { color: var(--text-muted); }

  .apikey-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
  }

  .apikey-input.valid { border-color: var(--success); }

  .apikey-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 15px;
    padding: 2px;
    transition: color 0.2s;
    line-height: 1;
  }

  .apikey-toggle:hover { color: var(--text); }

  .apikey-status {
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .apikey-status.ok { color: var(--success); }

  /* Settings */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-top: 24px;
  }

  .settings-title {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-family: 'Space Mono', monospace;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .setting-row:last-child { margin-bottom: 0; }

  .setting-label {
    font-size: 14px;
    color: var(--text);
    min-width: 100px;
    font-weight: 500;
  }

  .tag-count-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .tag-count-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(124,92,252,0.5);
    transition: box-shadow 0.2s;
  }

  .tag-count-slider::-webkit-slider-thumb:hover {
    box-shadow: 0 0 20px rgba(124,92,252,0.8);
  }

  .slider-value {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--accent2);
    min-width: 24px;
    text-align: center;
    font-weight: 700;
  }

  .lang-toggle {
    display: flex;
    gap: 8px;
  }

  .lang-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .lang-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    color: white;
    box-shadow: 0 0 15px rgba(124,92,252,0.4);
  }

  /* Analyze button */
  .analyze-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(124,92,252,0.35);
  }

  .analyze-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent2), var(--accent3));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .analyze-btn:hover:not(:disabled)::before { opacity: 1; }

  .analyze-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(124,92,252,0.5);
  }

  .analyze-btn:active:not(:disabled) { transform: translateY(0); }

  .analyze-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .analyze-btn span { position: relative; z-index: 1; }

  /* Loading */
  .loading-state {
    display: none;
    text-align: center;
    padding: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    margin-top: 24px;
  }

  .loading-state.visible { display: block; }

  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    color: var(--text-muted);
    font-size: 15px;
  }

  /* Results */
  .results-area {
    display: none;
    margin-top: 24px;
  }

  .results-area.visible { display: block; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .results-title {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .results-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
  }

  .tags-container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: tagAppear 0.5s ease forwards;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    position: relative;
    overflow: hidden;
  }

  @keyframes tagAppear {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tag-main {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .tag-main::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124,92,252,0.15), rgba(192,132,252,0.15));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .tag-main:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(124,92,252,0.2);
  }

  .tag-main:hover::before { opacity: 1; }

  .tag-confidence {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    padding: 2px 7px;
    border-radius: 20px;
    background: rgba(124,92,252,0.2);
    color: var(--accent2);
  }

  .copy-all-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Heebo', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .copy-all-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /* Error */
  .error-msg {
    display: none;
    background: rgba(244,63,94,0.1);
    border: 1px solid rgba(244,63,94,0.3);
    color: var(--error);
    padding: 16px 20px;
    border-radius: 12px;
    margin-top: 16px;
    font-size: 14px;
  }

  .error-msg.visible { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🏷️</div>
    </div>
    <h1>Photag</h1>
    <p class="subtitle">העלה תמונה וקבל תגים אוטומטיים בעזרת בינה מלאכותית</p>
  </header>

  <!-- API Key -->
  <div class="apikey-card">
    <span class="apikey-label">🔑 Groq Key</span>
    <div class="apikey-input-wrap">
      <input type="password" class="apikey-input" id="apikeyInput" placeholder="gsk_..." autocomplete="off" spellcheck="false">
      <button class="apikey-toggle" id="apikeyToggle" title="הצג/הסתר">👁</button>
    </div>
    <span class="apikey-status" id="apikeyStatus">לא הוזן</span>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <span class="upload-icon">📸</span>
    <div class="upload-text">גרור תמונה לכאן או לחץ לבחירה</div>
    <div class="upload-subtext">תומך ב-JPG, PNG, WebP, GIF עד 10MB</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Preview -->
  <div class="preview-area" id="previewArea">
    <img id="previewImg" src="" alt="תצוגה מקדימה">
    <button class="change-image-btn" id="changeImageBtn">✕ החלף תמונה</button>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div class="settings-title">⚙ הגדרות</div>
    <div class="setting-row">
      <span class="setting-label">מספר תגים</span>
      <input type="range" class="tag-count-slider" id="tagCount" min="3" max="20" value="8">
      <span class="slider-value" id="tagCountVal">8</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">שפת תגים</span>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="hebrew">עברית</button>
        <button class="lang-btn" data-lang="english">English</button>
        <button class="lang-btn" data-lang="both">שניהם</button>
      </div>
    </div>
  </div>

  <!-- Analyze Button -->
  <button class="analyze-btn" id="analyzeBtn" disabled>
    <span>✨ נתח תמונה</span>
  </button>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Loading -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <div class="loading-text">מנתח את התמונה עם AI...</div>
  </div>

  <!-- Results -->
  <div class="results-area" id="resultsArea">
    <div class="results-header">
      <div class="results-title">
        תגים שזוהו
        <span class="results-badge" id="tagCountBadge">0</span>
      </div>
      <button class="copy-all-btn" id="copyAllBtn">📋 העתק הכל</button>
    </div>
    <div class="tags-container" id="tagsContainer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let selectedFile = null;
  let selectedLang = 'hebrew';

  // API Key
  const apikeyInput = document.getElementById('apikeyInput');
  const apikeyToggle = document.getElementById('apikeyToggle');
  const apikeyStatus = document.getElementById('apikeyStatus');

  // Load saved key
  const savedKey = localStorage.getItem('photag_groq_key');
  if (savedKey) {
    apikeyInput.value = savedKey;
    updateKeyStatus(savedKey);
  }

  apikeyInput.addEventListener('input', () => {
    const val = apikeyInput.value.trim();
    localStorage.setItem('photag_groq_key', val);
    updateKeyStatus(val);
  });

  apikeyToggle.addEventListener('click', () => {
    const isHidden = apikeyInput.type === 'password';
    apikeyInput.type = isHidden ? 'text' : 'password';
    apikeyToggle.textContent = isHidden ? '🙈' : '👁';
  });

  function updateKeyStatus(key) {
    if (key && key.length > 20) {
      apikeyInput.classList.add('valid');
      apikeyStatus.textContent = '✓ מוכן';
      apikeyStatus.className = 'apikey-status ok';
    } else if (key) {
      apikeyInput.classList.remove('valid');
      apikeyStatus.textContent = '⚠ קצר מדי';
      apikeyStatus.className = 'apikey-status';
    } else {
      apikeyInput.classList.remove('valid');
      apikeyStatus.textContent = 'לא הוזן';
      apikeyStatus.className = 'apikey-status';
    }
  }

  // Upload zone
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const previewArea = document.getElementById('previewArea');
  const previewImg = document.getElementById('previewImg');
  const analyzeBtn = document.getElementById('analyzeBtn');

  uploadZone.addEventListener('click', () => fileInput.click());

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });

  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));

  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  document.getElementById('changeImageBtn').addEventListener('click', () => {
    selectedFile = null;
    previewArea.classList.remove('visible');
    analyzeBtn.disabled = true;
    clearResults();
    fileInput.value = '';
  });

  function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      previewArea.classList.add('visible');
      analyzeBtn.disabled = false;
      clearResults();
    };
    reader.readAsDataURL(file);
  }

  // Slider
  const tagCountSlider = document.getElementById('tagCount');
  const tagCountVal = document.getElementById('tagCountVal');
  tagCountSlider.addEventListener('input', () => {
    tagCountVal.textContent = tagCountSlider.value;
  });

  // Language toggle
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedLang = btn.dataset.lang;
    });
  });

  // Analyze
  analyzeBtn.addEventListener('click', analyzeImage);

  async function analyzeImage() {
    if (!selectedFile) return;

    const apiKey = apikeyInput.value.trim();
    if (!apiKey || apiKey.length < 20) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '❌ יש להזין Groq API key תקין (מתחיל ב-gsk_)';
      errorMsg.classList.add('visible');
      return;
    }

    const tagCount = tagCountSlider.value;
    const loading = document.getElementById('loadingState');
    const errorMsg = document.getElementById('errorMsg');

    analyzeBtn.disabled = true;
    clearResults();
    errorMsg.classList.remove('visible');
    loading.classList.add('visible');

    try {
      const base64 = await fileToBase64(selectedFile);
      const mediaType = selectedFile.type || 'image/jpeg';

      const langMap = {
        hebrew: 'ענה רק בעברית',
        english: 'respond only in English',
        both: 'ענה בעברית ואנגלית לכל תג: "עברית / English"'
      };
      const langInstruction = langMap[selectedLang];

      const prompt = `נתח את התמונה הזו וצור בדיוק ${tagCount} תגים תיאוריים.

כל תג צריך:
1. להיות קצר (1-3 מילים)
2. לתאר אלמנט ויזואלי, נושא, צבע, מצב רוח, אובייקט, או רעיון בתמונה
3. להיות שימושי לחיפוש ומיון תמונות

${langInstruction}

החזר JSON בדיוק בפורמט הזה ללא שום טקסט נוסף:
{"tags": [{"tag": "שם התג", "confidence": 95}]}

confidence הוא מספר בין 60-99 שמייצג כמה אתה בטוח בתג.`;

      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${encodeURIComponent(apiKey)}`
        },
        body: JSON.stringify({
          model: 'meta-llama/llama-4-scout-17b-16e-instruct',
          max_tokens: 1000,
          temperature: 0.2,
          messages: [{
            role: 'user',
            content: [
              { type: 'image_url', image_url: { url: base64 } },
              { type: 'text', text: prompt }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const text = data.choices?.[0]?.message?.content || '';
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      displayTags(parsed.tags);
    } catch (err) {
      console.error(err);
      errorMsg.textContent = '❌ שגיאה בניתוח התמונה: ' + err.message;
      errorMsg.classList.add('visible');
    } finally {
      loading.classList.remove('visible');
      analyzeBtn.disabled = false;
    }
  }

  function displayTags(tags) {
    const resultsArea = document.getElementById('resultsArea');
    const tagsContainer = document.getElementById('tagsContainer');
    const tagCountBadge = document.getElementById('tagCountBadge');

    tagsContainer.innerHTML = '';
    tagCountBadge.textContent = tags.length;

    tags.forEach((item, i) => {
      const tag = document.createElement('div');
      tag.className = 'tag tag-main';
      tag.style.animationDelay = `${i * 60}ms`;
      
      const conf = item.confidence || Math.floor(Math.random() * 30 + 70);
      const confColor = conf >= 90 ? '#10b981' : conf >= 75 ? '#f59e0b' : '#6b7280';
      
      tag.innerHTML = `
        <span>${item.tag}</span>
        <span class="tag-confidence" style="color:${confColor};background:${confColor}22">${conf}%</span>
      `;

      tag.addEventListener('click', () => {
        navigator.clipboard.writeText(item.tag).then(() => showToast(`"${item.tag}" הועתק!`));
      });

      tagsContainer.appendChild(tag);
    });

    resultsArea.classList.add('visible');
  }

  function clearResults() {
    document.getElementById('resultsArea').classList.remove('visible');
    document.getElementById('tagsContainer').innerHTML = '';
  }

  document.getElementById('copyAllBtn').addEventListener('click', () => {
    const tags = [...document.querySelectorAll('.tag-main span:first-child')]
      .map(el => el.textContent).join(', ');
    navigator.clipboard.writeText(tags).then(() => showToast('כל התגים הועתקו!'));
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
